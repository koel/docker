file:
  # Users extend the image and compile their own PHP extensions with these.
  /usr/bin/gcc:
    exists: true
  /usr/bin/make:
    exists: true
  /usr/local/bin/phpize:
    exists: true
  /usr/local/bin/pecl:
    exists: true
  /music:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html:
    exists: true
    owner: www-data
    group: www-data
    filetype: directory
  /tmp/koel:
    exists: true
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/.git:
    exists: false
  /var/www/html/.github:
    exists: false
  /var/www/html/.version:
    exists: true
    mode: "0644"
    owner: www-data
    group: www-data
    filetype: file
    contains:
    - v9.15.0 # DO NOT REMOVE — used by the release script
  /var/www/html/artisan:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: file
  /var/www/html/cypress:
    exists: false
  /var/www/html/node_modules:
    exists: false
  /var/www/html/public/.htaccess:
    exists: true
    mode: "0644"
    owner: www-data
    group: www-data
    filetype: file
  /var/www/html/public/build/assets:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/public/index.php:
    exists: true
    mode: "0644"
    owner: www-data
    group: www-data
    filetype: file
  /var/www/html/storage/framework/cache:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/storage/framework/sessions:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/storage/framework/views:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/storage/search-indexes:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/storage/app/public/images:
    exists: true
    mode: "0755"
    owner: www-data
    group: www-data
    filetype: directory
  /var/www/html/public/storage:
    exists: true
    filetype: symlink
    linked-to: ../storage/app/public
package:
  ffmpeg:
    installed: true
  libapache2-mod-xsendfile:
    installed: true
port:
  tcp:80:
    listening: true
    ip:
    - 0.0.0.0
service:
  apache2:
    enabled: true
    skip: false
    running: true
user:
  www-data:
    exists: true
    uid: 33
    gid: 33
    groups:
    - www-data
    home: /var/www
    shell: /usr/sbin/nologin
group:
  www-data:
    exists: true
    gid: 33
command:
  php_extensions:
    exec: php -m
    exit-status: 0
    stdout: ['/^redis$/', '!/^pcntl$/']
    timeout: 0
  php_extensions_for_queue_and_reverb:
    exec: php -d extension=pcntl -m
    exit-status: 0
    stdout: ['/^pcntl$/']
    stderr: []
    timeout: 0
  apache_proxy_modules:
    exec: apache2ctl -M
    exit-status: 0
    stdout: ['proxy_module', 'proxy_http_module']
    timeout: 0
  artisan_env:
    exec: php artisan env
    exit-status: 0
    stdout: ['/production/']
    stderr: []
    timeout: 0
process:
  apache2:
    running: true
http:
  http://localhost/sw.js:
    status: 200
    allow-insecure: false
    no-follow-redirects: false
    timeout: 5000
